[project]
name = "trendr"
version = "2.1.0"
description = "Research-agent harness system — automated literature review with state machine orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

# Zero external dependencies for the engine core.
# All imports are Python stdlib: json, csv, pathlib, datetime, subprocess, argparse, logging, re, time, io, abc
dependencies = []

[project.optional-dependencies]
cli = [
    # Future: dependencies for standalone CLI adapter (Phase 3)
    # "anthropic>=0.40",  # for LLM API calls
    # "httpx>=0.27",      # for async HTTP
]

[project.scripts]
trendr = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["engine*"]
