name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pyyaml
          pip install -e . || pip install pytest pyyaml  # fallback if editable install fails

      - name: Run unit + contract tests
        run: python -m pytest tests/ -q --ignore=tests/e2e --maxfail=5

  smoke-claude-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pyyaml
          pip install -e . || pip install pytest pyyaml

      - name: Run e2e smoke (native dispatch loop)
        env:
          RUN_E2E: "1"
        run: python -m pytest tests/e2e/test_claude_code_smoke.py -q
